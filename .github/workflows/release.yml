name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      # GATE, before anything is published. The notes are not the workflow's to
      # write - a CHANGELOG entry is deliberately one or two lines for a
      # contributor, which makes poor release notes for a reader deciding
      # whether to upgrade - so a human writes the draft first and this refuses
      # to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $GITHUB_REF_NAME. Write the notes first:" \
                 "gh release create $GITHUB_REF_NAME --draft --notes-file NOTES.md"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $GITHUB_REF_NAME has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - name: The version surfaces agree
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            [ "$version" = "$GITHUB_REF_NAME" ] \
              || { echo "::error::package.json is $version, tag is $GITHUB_REF_NAME"; exit 1; }
          fi
          grep -qE "^## \[?${version//./\\.}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated section for $version"; exit 1; }
          repository="$(node -p 'require("./package.json").repository.url')"
          [ "$repository" = 'git+https://github.com/markup-carve/carve-css.git' ] \
            || { echo "::error::package.json repository.url cannot support npm provenance"; exit 1; }

      - name: The npm credential authenticates
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] \
            || { echo "::error::NPM_TOKEN is not configured"; exit 1; }
          code="$(curl -sS -o /tmp/npm-who.json -w '%{http_code}' \
            -H "Authorization: Bearer $NPM_TOKEN" \
            https://registry.npmjs.org/-/whoami)"
          [ "$code" = 200 ] \
            || { echo "::error::NPM_TOKEN does not authenticate (HTTP $code)"; exit 1; }
          echo "npm: authenticated as $(node -p 'require("/tmp/npm-who.json").username')"

      - run: npm install --no-audit --no-fund
      - run: npm test

      - name: The package contains every public stylesheet
        run: |
          tarball="$(npm pack --silent)"
          listing="$(tar -tzf "$tarball")"
          for file in carve tokens core extensions recipes print; do
            printf '%s\n' "$listing" | grep -qx "package/src/$file.css" \
              || { echo "::error::$tarball is missing src/$file.css"; exit 1; }
          done

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm publish --dry-run --provenance --access public
            echo "::notice::rehearsal - nothing was published"
          else
            npm publish --provenance --access public
          fi

      # Publish the draft a human wrote. Addressed by ID with tag_name sent,
      # because omitting tag_name on a draft clears the tag to `untagged-...`.
      - name: Publish the release notes written for this tag
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | first | .id // empty")"
          [ -n "$id" ] || { echo "::error::the release for $GITHUB_REF_NAME vanished"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$GITHUB_REF_NAME" -F draft=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq 'if .draft then error("release is still a draft") else "published \(.tag_name)" end'
