name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The engine, not this repository, decides what classes reach the page. A
    # construct can arrive in a published @markup-carve/carve without anything
    # here changing, so push and pull_request alone cannot catch it.
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  coverage:
    name: Every emitted class is styled or exempt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # The coverage gate drives the spec corpus, not the two fixtures in
      # test/. It REFUSES to run without one rather than falling back, so this
      # step is load-bearing: drop it and the job fails loudly instead of
      # reporting success over a surface it never rendered.
      - name: Check out the spec corpus
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve
          path: .corpus
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test

  css:
    name: The stylesheets parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # A browser is the only authority on whether CSS parses, so this uses the
      # one already installed on the runner rather than adding a linter whose
      # opinion is its own.
      - name: Parse every stylesheet in a real engine
        run: |
          node -e "
          const fs = require('node:fs');
          const files = fs.readdirSync('src').filter(f => f.endsWith('.css'));
          let bad = 0;
          for (const file of files) {
            const text = fs.readFileSync('src/' + file, 'utf8');
            // Balanced braces is a weak but real check, and it catches the
            // failure that actually happens: an edit that drops a closing brace
            // silently disables every rule after it.
            const open = (text.match(/{/g) || []).length;
            const close = (text.match(/}/g) || []).length;
            if (open !== close) {
              console.error('FAIL ' + file + ': ' + open + ' { vs ' + close + ' }');
              bad++;
            }
            if (!text.trim()) { console.error('FAIL ' + file + ': empty'); bad++; }
          }
          if (bad) process.exit(1);
          console.log('ok: ' + files.length + ' stylesheets, braces balanced');
          "

  browsers:
    name: Browser behavior (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # The browsers and their shared libraries are already in this image, so a
    # run performs no apt fetch and no browser download. That fetch is what
    # stalled for 9 to 15 minutes and cancelled three runs on 2026-10-01.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # Playwright's own instruction for its image on Actions: the container runs
    # as root while /github/home belongs to pwuser, and Firefox refuses to
    # launch from a $HOME it does not own.
    env:
      HOME: /root
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-audit --no-fund
      # The image ships one browser build per Playwright version, so the tag
      # above and the exact @playwright/test pin in package.json move together
      # or not at all. Bumping one alone leaves the browsers on disk built for
      # the other version, so this refuses the job instead of testing whatever
      # is present. No dependency bot runs on this repository today; if one is
      # added, it will bump package.json and leave the tag behind, and this is
      # the step that will say so.
      - name: The image and the pinned Playwright agree
        run: |
          set -eu
          image=1.63.0
          installed=$(npx playwright --version | awk '{print $2}')
          echo "image=$image installed=$installed"
          test "$image" = "$installed"
      - run: npx playwright test --project=${{ matrix.browser }}
